jtex: v1
title: Plain LaTeX (wide margins)
description: Plain LaTeX with 1.25 inch margins and no logo, for journal proposals
version: 1.0.0
license: CC-BY-4.0
# Derived from the MyST "Plain LaTeX" template (tex/myst/plain_latex), which is
# CC-BY-4.0; the upstream authors field was dropped when this copy was vendored,
# and attribution is a licence condition, so it is restored here.
authors:
  - name: Steve Purves
    affiliations:
      - Curvenote
parts:
  - id: abstract
    description: Article abstract.
doc:
  - id: title
    required: true
  - id: authors
    required: false
  - id: date
  - id: bibliography
options:
  - id: link
    type: string
    title: Footnote Link
    description: Adds a footnote containing a link to the online version.
  - id: logo
    type: boolean
    default: false
    title: Curvenote Logo
    description: Adds the Curvenote logo after the abstract.
  # The version box at the top right of the first page; CONTRIBUTING.md
  # explains each field.
  - id: version
    type: string
    title: Version
    description: The model description's version, MAJOR.MINOR. Setting it draws the version box.
  - id: status
    type: choice
    choices:
      - draft
      - released
    title: Status
    description: draft while the version is 0.x; released from 1.0.
  - id: ai_level
    type: number
    title: AI-assistance level
    description: How much AI was involved in producing the text, from 0 (none) to 4.
  - id: ai_used_for
    type: string
    title: AI used for
    description: Comma-separated uses, from drafting, editing, code, derivation checks, literature and figures.
  - id: verified_by
    type: string
    title: Verified by
    description: The person who read the whole description and checked it against its sources.
  - id: verified_date
    type: string
    title: Verification date
    description: The date of that verification, YYYY-MM-DD.
  - id: verified_version
    type: string
    title: Verified version
    description: The version that was verified; the box shows "not yet verified" when it differs from version.
files:
  - template.tex
  - curvenote.png
packages:
  - datetime
  - graphicx
  - hyperref
  - natbib
  - fvextra
