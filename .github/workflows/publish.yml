# Publishes docs/ to GitHub Pages, and a live preview of each pull request.
#
# The landing page is hand-written static HTML. The one build step renders each
# model description into a page under docs/models/; the rest of the job is
# checks: the things that break silently when a page is edited are asserted
# here rather than eyeballed in a browser.
#
# The site is served from the gh-pages branch, the scheme QuantEcon.manual
# uses. A push to main publishes docs/ to the branch's root. A pull request
# from a branch of this repository publishes the same build to pr-<number>/,
# served at https://quantecon.github.io/community-library/pr-<number>/, so
# that reviewers, and the people a page is about, can read it before it
# merges; the address is commented on the pull request, with links to the
# pages it changes, and the folder is removed when the pull request closes.
# A pull request from a fork has a read-only token, so it gets the built site
# as a workflow artifact instead.
#
# Pages must be set to serve the branch for this to take effect:
# Settings -> Pages -> Build and deployment -> Source: Deploy from a branch,
# branch gh-pages, folder / (root).
#
# Every job that writes gh-pages shares one concurrency group:
# peaceiris/actions-gh-pages pushes from a SHA read at job start, so two
# writers at once lose one commit (QuantEcon.manual#121). The build runs
# lock-free; only the few seconds of writing take the lock.

name: Publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Only to remove a closed pull request's preview: this event carries the
  # base branch's permissions, and the job checks out gh-pages, never the
  # pull request's code.
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the site tools
        run: python -m pip install -r tools/requirements.txt

      # Each model description becomes docs/models/<model>/index.html, with its
      # PDF beside it. The pages are built here rather than committed.
      - name: Build the model description pages
        run: python tools/build_pages.py

      # Versions, AI disclosure and verification: the description front matter,
      # each implementation's metadata.yml and the library table must agree.
      - name: Check versions and disclosure records
        run: python tools/check_metadata.py

      - name: Check local references resolve
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          missing=0
          for f in $(find . -name '*.html' | sort); do
            dir=$(dirname "$f")
            # A reference ending in / is a directory, served by its index.html.
            for ref in $(grep -oE '(href|src)="[A-Za-z0-9._/-]+(\.(html|css|js|png|svg|pdf|ipynb)|/)"' "$f" \
                         | sed -E 's/^(href|src)="//;s/"$//' | sort -u); do
              target="$dir/$ref"
              case "$ref" in */) target="${target}index.html" ;; esac
              [ -e "$target" ] || { echo "::error file=docs/${f#./}::references missing $ref"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok — every local reference resolves"

      # An in-page link to a section that has been renamed still looks fine in
      # the markup and lands you nowhere in the browser.
      - name: Check in-page anchors resolve
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          missing=0
          for f in $(find . -name '*.html' | sort); do
            # A page may have no in-page links (the talk's slides have none):
            # grep exits 1 when nothing matches, which pipefail would turn
            # into a failed step, so an empty match is allowed explicitly.
            { grep -oE 'id="[^"]+"'    "$f" || true; } | sed 's/id="//;s/"//'    | sort -u > /tmp/ids
            { grep -oE 'href="#[^"]+"' "$f" || true; } | sed 's/href="#//;s/"//' | sort -u > /tmp/targets
            for t in $(comm -13 /tmp/ids /tmp/targets); do
              echo "::error file=docs/${f#./}::anchor #$t has no matching id"
              missing=1
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok — every in-page anchor resolves"

      # The contents rail is wired to the sections by matching data attributes.
      # Drop one side and the rail silently stops highlighting.
      - name: Check the contents rail is wired to its sections
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          for f in $(grep -rl 'data-spy=' --include='*.html' . | sed 's#^\./##' | sort); do
            grep -oE 'data-navlink="[^"]+"' "$f" | sed 's/.*="//;s/"//' | sort -u > /tmp/navlinks
            grep -oE 'data-spy="[^"]+"'     "$f" | sed 's/.*="//;s/"//' | sort -u > /tmp/spies
            if ! diff -q /tmp/navlinks /tmp/spies >/dev/null; then
              echo "::error file=docs/$f::the rail's data-navlink values and the sections' data-spy values disagree"
              diff /tmp/navlinks /tmp/spies || true
              exit 1
            fi
            echo "ok — $f: $(wc -l < /tmp/spies | tr -d ' ') sections wired to the rail"
          done

      # The built site, for the publish and preview jobs below; on a fork's
      # pull request, which cannot publish, it is what the author downloads
      # to see the rendered result.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: docs
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: docs

      # keep_files leaves the pr-<number>/ previews in place. It also leaves
      # a page that has been deleted or renamed, so remove such a file from
      # gh-pages by hand.
      - name: Publish the site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          keep_files: true
          force_orphan: false

  preview:
    needs: build
    # A fork's pull request gets the checks above but no preview: its token
    # is read-only, so the push would fail, and a fork's build should never
    # hold the gh-pages lock.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: docs

      - name: Publish the preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          destination_dir: pr-${{ github.event.number }}
          force_orphan: false

      # The address, and a link to each page the pull request changes, so a
      # reviewer lands on what changed rather than on the landing page.
      - name: Comment the preview's address
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request.number;
            const base = `https://quantecon.github.io/community-library/pr-${number}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const pages = new Set();
            for (const f of files) {
              if (f.status === 'removed') continue;
              let m;
              // A hand-written page, served at its path; an index at its directory.
              if ((m = f.filename.match(/^docs\/(.*\.html)$/))) {
                pages.add(m[1].replace(/(^|\/)index\.html$/, '$1'));
              }
              // A model description, built to docs/models/<model>/.
              if ((m = f.filename.match(/^models\/([^/]+)\/model-description\.md$/))) {
                pages.add(`models/${m[1]}/`);
              }
            }

            let body = `**Site preview** · [${base}/](${base}/) (${sha})`;
            if (pages.size) {
              const links = [...pages].sort().map(p => `- [${p || 'index'}](${base}/${p})`);
              body += `\n\n**Changed pages:**\n${links.join('\n')}`;
            }
            body += `\n\nThe preview is updated on every push and removed when the pull request closes.`;

            // One comment per pull request, updated in place.
            const marker = '<!-- site-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
            });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            const full = `${marker}\n${body}`;
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body: full,
              });
            }

  remove-preview:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove the pull request's preview
        env:
          PR_DIR: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          if [ ! -d "$PR_DIR" ]; then
            echo "no $PR_DIR on gh-pages; nothing to remove"
            exit 0
          fi
          git rm -r -q "$PR_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Remove the preview of pull request #${{ github.event.number }}"
          # Another writer may have pushed meanwhile; rebase and retry.
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase origin gh-pages
            sleep 5
          done
          git fetch origin gh-pages
          if git ls-tree -d --name-only origin/gh-pages "$PR_DIR" | grep -q .; then
            echo "::error::$PR_DIR is still on origin/gh-pages"
            exit 1
          fi
