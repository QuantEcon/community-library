# Publishes docs/ to GitHub Pages, and a live preview of each pull request.
#
# The landing page is hand-written static HTML. The one build step renders each
# model description into a page under docs/models/; the rest of the job is
# checks: the things that break silently when a page is edited are asserted
# here rather than eyeballed in a browser.
#
# Pages must be set to build from GitHub Actions for this to take effect:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# A pull request from a branch of this repository is also deployed to
# Cloudflare Pages, at https://pr-<number>.<project>.pages.dev, so that
# reviewers, and the people a page is about, can read it before it merges. The
# address is the same for every push and is posted as a comment on the pull
# request. Previews live outside the repository, so they add nothing to its
# size. This uses QuantEcon's shared action and needs, once, the repository
# secrets CLOUDFLARE_API_TOKEN (Account: Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project named as PREVIEW_PROJECT below is
# created on the first run if the account does not have it; a Worker of the
# same name is a different thing and does not count.
# A pull request from a fork gets no secrets, so the action skips it and the
# built site is attached as a workflow artifact instead.

name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Cloudflare Pages project the previews deploy to; its name is in every
  # preview address.
  PREVIEW_PROJECT: community-library
  # Until the secrets exist, the preview steps are skipped rather than failing
  # the checks. (A step's `if` cannot read secrets; an env value can.)
  PREVIEW_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the preview's comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the site tools
        run: python -m pip install -r tools/requirements.txt

      # Each model description becomes docs/models/<model>/index.html, with its
      # PDF beside it. The pages are built here rather than committed.
      - name: Build the model description pages
        run: python tools/build_pages.py

      # Versions, AI disclosure and verification: the description front matter,
      # each implementation's metadata.yml and the library table must agree.
      - name: Check versions and disclosure records
        run: python tools/check_metadata.py

      - name: Check local references resolve
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          missing=0
          for f in $(find . -name '*.html' | sort); do
            dir=$(dirname "$f")
            # A reference ending in / is a directory, served by its index.html.
            for ref in $(grep -oE '(href|src)="[A-Za-z0-9._/-]+(\.(html|css|js|png|svg|pdf|ipynb)|/)"' "$f" \
                         | sed -E 's/^(href|src)="//;s/"$//' | sort -u); do
              target="$dir/$ref"
              case "$ref" in */) target="${target}index.html" ;; esac
              [ -e "$target" ] || { echo "::error file=docs/${f#./}::references missing $ref"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok — every local reference resolves"

      # An in-page link to a section that has been renamed still looks fine in
      # the markup and lands you nowhere in the browser.
      - name: Check in-page anchors resolve
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          missing=0
          for f in $(find . -name '*.html' | sort); do
            # A page may have no in-page links (the talk's slides have none):
            # grep exits 1 when nothing matches, which pipefail would turn
            # into a failed step, so an empty match is allowed explicitly.
            { grep -oE 'id="[^"]+"'    "$f" || true; } | sed 's/id="//;s/"//'    | sort -u > /tmp/ids
            { grep -oE 'href="#[^"]+"' "$f" || true; } | sed 's/href="#//;s/"//' | sort -u > /tmp/targets
            for t in $(comm -13 /tmp/ids /tmp/targets); do
              echo "::error file=docs/${f#./}::anchor #$t has no matching id"
              missing=1
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok — every in-page anchor resolves"

      # The contents rail is wired to the sections by matching data attributes.
      # Drop one side and the rail silently stops highlighting.
      - name: Check the contents rail is wired to its sections
        shell: bash
        run: |
          set -euo pipefail
          cd docs
          for f in $(grep -rl 'data-spy=' --include='*.html' . | sed 's#^\./##' | sort); do
            grep -oE 'data-navlink="[^"]+"' "$f" | sed 's/.*="//;s/"//' | sort -u > /tmp/navlinks
            grep -oE 'data-spy="[^"]+"'     "$f" | sed 's/.*="//;s/"//' | sort -u > /tmp/spies
            if ! diff -q /tmp/navlinks /tmp/spies >/dev/null; then
              echo "::error file=docs/$f::the rail's data-navlink values and the sections' data-spy values disagree"
              diff /tmp/navlinks /tmp/spies || true
              exit 1
            fi
            echo "ok — $f: $(wc -l < /tmp/spies | tr -d ' ') sections wired to the rail"
          done

      # Fork PRs get a read-only token and no secrets, so the site is
      # attached as well — the author can see the rendered result.
      - name: Upload the built site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: docs
          retention-days: 14

      # The preview action runs wrangler, which needs Node 22 or later.
      - name: Set up Node for the preview
        if: github.event_name == 'pull_request' && env.PREVIEW_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The preview action deploys to an existing Pages project. Create it
      # the first time, so that setup is the two secrets and nothing else.
      - name: Create the Pages project if it is missing
        if: github.event_name == 'pull_request' && env.PREVIEW_CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@4 pages project list | grep -qw "$PREVIEW_PROJECT"; then
            echo "Pages project $PREVIEW_PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PREVIEW_PROJECT" --production-branch main
          fi

      # lectures-dir is empty because this is not a lecture site: the comment
      # then carries the preview address alone.
      - name: Deploy the pull request's preview
        if: github.event_name == 'pull_request' && env.PREVIEW_CONFIGURED == 'true'
        uses: quantecon/actions/preview-cloudflare@v0.12.0
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project-name: ${{ env.PREVIEW_PROJECT }}
          build-dir: docs
          lectures-dir: ''

      - name: Say why there is no preview
        if: github.event_name == 'pull_request' && env.PREVIEW_CONFIGURED != 'true'
        run: |
          echo "::notice::No preview: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy pull requests to Cloudflare Pages."

      - name: Package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only the deploy needs a mutex. Held workflow-wide it would also cover
    # pull_request runs, which never reach this job, so a PR's checks would
    # queue a push-to-main deploy behind them. Let a deploy finish rather than
    # cancelling it mid-flight; queued pushes coalesce.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
